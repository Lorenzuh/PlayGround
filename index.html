const suspects=[
{id:'elias',name:'Elias Moura',role:'CHEFE DOS TRILHOS',initials:'EM',bio:'Conhecia cada porta da estação. Diz que passou a noite conferindo a sinalização.',tag:'ÁLIBI: NENHUMA TESTEMUNHA',question:'O que fazia na plataforma às 23h12?',choices:[{text:'“Conferia os trilhos. A chave mestra? Deve ter sumido antes.”',result:'Ele nega a chave, mas a escala assinada prova que estava no escritório — e podia acessar o cofre.',evidence:{id:'alibi',icon:'◉',name:'Contradição de Elias',desc:'Elias negou ter a chave, mas sua assinatura o coloca na sala do chefe.',source:'INTERROGATÓRIO'}}]},
{id:'iris',name:'Íris Valença',role:'BILHETEIRA',initials:'IV',bio:'Foi a última pessoa a vender um bilhete a Helena. Quer sair da estação antes do amanhecer.',tag:'ÁLIBI: GUICHÊ DE VENDAS',question:'Por que vendeu uma passagem fora do expediente?',choices:[{text:'“Helena pediu. Disse que precisava encontrar alguém sem ser vista.”',result:'Íris confirma que Helena estava investigando alguém da estação. Ela viu um casaco verde na plataforma.',evidence:{id:'witness',icon:'◉',name:'Depoimento de Íris',desc:'Helena marcou um encontro secreto; um funcionário de casaco verde esperava por ela.',source:'INTERROGATÓRIO'}}]},
{id:'nuno',name:'Nuno Reis',role:'CARREGADOR',initials:'NR',bio:'Carregava caixas naquela noite. Alega que não viu ninguém depois da partida.',tag:'ÁLIBI: DEPÓSITO DE CARGA',question:'O que havia nas caixas sem registro?',choices:[{text:'“Prata do museu. Elias me pagou para não fazer perguntas.”',result:'Nuno admite ter ajudado no desvio. Helena descobriu o esquema e ia entregar as provas.',evidence:{id:'motive',icon:'◉',name:'Confissão de Nuno',desc:'O roubo da prata era comandado por Elias. Helena tinha provas e seria paga pelo silêncio.',source:'INTERROGATÓRIO'}}]}
];
const initialState={view:'home',location:'platform',found:[],interviewed:[],events:[],complete:false,wrong:0};
let state;try{state={...initialState,...JSON.parse(localStorage.getItem('arquivo09')||'{}'),view:'home'}}catch{state={...initialState}}
const app=document.getElementById('app');
const evidenceItems=()=>locations.flatMap(l=>l.clues.filter(c=>state.found.includes(c.id)).map(c=>({...c,source:l.name}))).concat(suspects.flatMap(s=>s.choices.filter(c=>state.interviewed.includes(s.id)).map(c=>c.evidence)));
const progress=()=>Math.round((state.found.length+state.interviewed.length)/(locations.reduce((n,l)=>n+l.clues.length,0)+suspects.length)*100);
function save(){localStorage.setItem('arquivo09',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setView(view){state.view=view;save();render()}
function navButton(id,icon,label,count=''){return `<button class="nav-btn ${state.view===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span>${label}<span class="nav-count">${count}</span></button>`}
function render(){const p=progress();app.innerHTML=`<aside class="sidebar"><div class="brand"><div class="brand-mark">09</div><div class="brand-name">ARQUIVO<span>UNIDADE DE CASOS FRIOS</span></div></div><div class="section-label">CASO ATIVO</div><div class="case-chip"><div class="eyebrow">CASO Nº 09 — ABERTO</div><b>O Último Trem</b><small>Estação Central · 14 out 1998</small></div><div class="section-label">INVESTIGAÇÃO</div><nav class="nav-list">${navButton('home','⌂','Visão geral')}${navButton('locations','⌖','Locais',`${locations.length}`)}${navButton('evidence','▤','Evidências',`${evidenceItems().length}`)}${navButton('suspects','♙','Suspeitos',`${state.interviewed.length}/3`)}${navButton('board','⌘','Quadro de pistas')}</nav><div class="sidebar-bottom"><div class="case-status"><div class="status-row"><span>PROGRESSO DO CASO</span><span>${p}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div><div class="status-note">${state.complete?'Caso encerrado. Bom trabalho.':`${state.found.length} pistas · ${state.interviewed.length} depoimentos`}</div></div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">ARQUIVO / <span>CASO 09</span> / ${({home:'VISÃO GERAL',locations:'LOCAIS',scene:'INVESTIGAÇÃO',evidence:'EVIDÊNCIAS',suspects:'SUSPEITOS',board:'QUADRO DE PISTAS'})[state.view]||'VISÃO GERAL'}</div><div class="top-actions"><span class="day-pill">◷ &nbsp;14 OUT 1998</span><button class="sound-btn" id="resetBtn" aria-label="Reiniciar caso" title="Reiniciar caso">↺</button></div></header><div class="content">${viewContent()}<div class="footer-note">ARQUIVO 09 &nbsp;·&nbsp; DIVISÃO DE INVESTIGAÇÃO &nbsp;·&nbsp; EST. 1987</div></div></main><nav class="mobile-nav">${[['home','⌂','INÍCIO'],['locations','⌖','LOCAIS'],['evidence','▤','PISTAS'],['suspects','♙','PESSOAS'],['board','⌘','DOSSIÊ']].map(([id,ic,n])=>`<button data-view="${id}" class="${state.view===id?'active':''}"><span>${ic}</span><span>${n}</span></button>`).join('')}</nav><div id="modalRoot"></div><div class="toast" id="toast"></div>`;bind();}
function viewContent(){switch(state.view){case'locations':return locationsView();case'scene':return sceneView();case'evidence':return evidenceView();case'suspects':return suspectsView();case'board':return boardView();default:return homeView()}}
function homeView(){return `<section class="view active"><div class="hero"><div class="hero-art"></div><div class="hero-stamp">ARQUIVO ABERTO<br>CASO Nº 09</div><div class="hero-copy"><div class="kicker">UMA INVESTIGAÇÃO INTERATIVA</div><h1>O Último<br>Trem</h1><p>Uma morte. Três suspeitos. E uma estação que guarda mais segredos do que passageiros.</p><button class="primary-btn" data-view="locations">${state.found.length?'CONTINUAR INVESTIGAÇÃO':'INICIAR INVESTIGAÇÃO'} &nbsp;→</button></div></div><div class="section-head"><h2>O caso em suas mãos</h2><p>INVESTIGUE NO SEU RITMO</p></div><div class="overview-grid"><article class="brief-card"><div class="card-kicker">RELATÓRIO INICIAL &nbsp; / &nbsp; 14 OUT 1998</div><h3>Uma noite sem testemunhas.</h3><p>Helena Duarte, repórter investigativa, foi encontrada morta na plataforma 3 pouco antes da meia-noite. O relógio da estação parou às 23h17. O último trem partiu vazio. A polícia local classificou como acidente — mas há sinais de que alguém preparou a cena.</p><div class="meta-row"><div class="meta-item"><span>VÍTIMA</span><b>Helena Duarte, 34</b></div><div class="meta-item"><span>LOCAL</span><b>Estação Central</b></div><div class="meta-item"><span>STATUS</span><b style="color:var(--acid)">${state.complete?'RESOLVIDO':'EM ABERTO'}</b></div></div></article><article class="activity-card"><div class="activity-title"><h3>Notas do caso</h3><span class="live-dot"></span></div>${state.events.length?state.events.slice(-3).reverse().map(e=>`<div class="activity-item"><i>✳</i><span>${esc(e)}</span></div>`).join(''):'<div class="activity-empty">Nenhuma pista registrada ainda.<br>Explore os locais e converse com as pessoas envolvidas.</div>'}</article></div></section>`}
function viewHead(kicker,title,desc,action=''){return `<div class="view-head"><div><div class="kicker">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function locationsView(){return `<section class="view active">${viewHead('CAMPO / ESTAÇÃO CENTRAL','Locais','Cada canto da estação conta uma história. Procure com atenção.')}<div class="location-grid">${locations.map((l,i)=>{const count=l.clues.filter(c=>state.found.includes(c.id)).length;return `<article class="location-card" data-location="${l.id}"><div class="location-thumb"><img src="${l.image}" alt=""><span>${l.type}</span></div><div class="location-info"><h3>${l.name}</h3><p>${l.place}</p><div class="location-foot"><span>PISTAS ENCONTRADAS</span><b>${count} / ${l.clues.length} &nbsp; →</b></div></div></article>`}).join('')}</div></section>`}
function sceneView(){const l=locations.find(x=>x.id===state.location)||locations[0];return `<section class="view active">${viewHead(l.type,l.name,l.place,`<button class="secondary-btn" data-view="locations">← &nbsp; TODOS OS LOCAIS</button>`)}<div class="scene-layout"><div><div class="scene-image"><img src="${l.image}" alt="${l.name}"><div class="scene-caption"><b>${l.name}</b><span>${l.place.toUpperCase()}</span></div></div><div class="scene-description">${l.desc}<br><span style="color:#d5f073">Investigue os itens abaixo para registrar evidências no seu dossiê.</span></div></div><div><div class="section-head" style="margin:0 0 11px"><h2 style="font-size:18px">Pontos de interesse</h2><p>${l.clues.filter(c=>state.found.includes(c.id)).length}/${l.clues.length} ANALISADOS</p></div><div class="clue-list">${l.clues.map(c=>{const found=state.found.includes(c.id);return `<button class="clue-card ${found?'found':''}" data-clue="${c.id}"><span class="clue-symbol">${found?'✓':c.icon}</span><span><b>${c.name}</b><small>${found?'Evidência registrada':c.desc}</small></span><span class="clue-state">${found?'✓':'ANALISAR'}</span></button>`}).join('')}</div></div></div></section>`}
function evidenceView(){const items=evidenceItems();return `<section class="view active">${viewHead('DOSSIÊ / COLETADAS','Evidências',`${items.length} evidência${items.length===1?'':'s'} registradas até agora.`)}<div class="evidence-grid">${items.length?items.map(e=>`<article class="evidence-card"><div class="evidence-icon">${e.icon||'⌕'}</div><div><h3>${e.name}</h3><p>${e.detail||e.desc}</p><div class="evidence-meta">${e.source}</div></div></article>`).join(''):'<div class="empty-state">Seu dossiê ainda está vazio.<br>Explore os locais e analise os pontos de interesse.</div>'}</div></section>`}
function suspectsView(){return `<section class="view active">${viewHead('INVESTIGAÇÃO / DEPOIMENTOS','Pessoas envolvidas',`${state.interviewed.length} de 3 depoimentos registrados. Cada conversa pode mudar o rumo do caso.`)}<div class="suspect-grid">${suspects.map(s=>`<article class="suspect-card ${state.interviewed.includes(s.id)?'interviewed':''}">${state.interviewed.includes(s.id)?'<span class="interview-count">OUVIDO ✓</span>':''}<div class="suspect-top"><div class="avatar">${s.initials}</div><div><h3>${s.name}</h3><small>${s.role}</small></div></div><p>${s.bio}</p><div class="suspect-tag">${s.tag}</div><button class="secondary-btn" data-interview="${s.id}">${state.interviewed.includes(s.id)?'REVER DEPOIMENTO':'INICIAR CONVERSA'} &nbsp;→</button></article>`).join('')}</div></section>`}
function boardView(){const items=evidenceItems();return `<section class="view active">${viewHead('ANÁLISE / CONEXÕES','Quadro de pistas','Ligue as evidências. Quando estiver pronto, apresente sua conclusão.')}<div class="board-layout"><div class="board-card"><div class="board-title">ESTAÇÃO CENTRAL &nbsp;·&nbsp; QUADRO DE INVESTIGAÇÃO</div>${items.length?`<div class="board-lines"><svg viewBox="0 0 500 260" preserveAspectRatio="none"><path d="M90 55 C180 90 300 60 390 120 M100 200 C200 140 270 200 390 120" fill="none" stroke="#b66d50" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8"/></svg></div><div class="board-items">${items.slice(0,8).map(e=>`<div class="board-note"><small>${esc(e.source||'EVIDÊNCIA')}</small><b>${esc(e.name)}</b></div>`).join('')}</div>`:'<div class="board-empty">Ainda não há pistas para conectar.<br>Comece sua investigação nos locais da estação.</div>'}</div><aside class="deduction-panel"><div class="card-kicker">RELATÓRIO FINAL</div><h3>Quem matou Helena?</h3><p>Escolha quem acredita ser o culpado, seu motivo e a evidência que sustenta sua conclusão.</p><label class="form-label" for="culprit">SUSPEITO</label><select class="select-control" id="culprit"><option value="">Selecione uma pessoa</option>${suspects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><label class="form-label" for="motive">MOTIVO</label><select class="select-control" id="motive"><option value="">Selecione um motivo</option><option value="robbery">Impedir que ela denunciasse um roubo</option><option value="jealousy">Ciúme e vingança pessoal</option><option value="money">Disputa por herança</option></select><label class="form-label" for="proof">EVIDÊNCIA-CHAVE</label><select class="select-control" id="proof"><option value="">Selecione uma evidência</option>${items.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><button class="primary-btn" id="submitAccusation">APRESENTAR CONCLUSÃO &nbsp;→</button></aside></div>${state.complete?`<div class="report-card"><div class="card-kicker">CASO ENCERRADO · 15 OUT 1998</div><h3>Justiça, enfim.</h3><p>Elias Moura foi preso ao amanhecer. A prata roubada foi recuperada no depósito dos trilhos. Seu relatório levou à reabertura de outros quatro casos arquivados na estação.</p><div class="report-actions"><button class="secondary-btn" data-view="evidence">REVER EVIDÊNCIAS</button><button class="secondary-btn" id="resetFromReport">NOVO CASO ↺</button></div></div>`:''}</section>`}
function showModal(title,kicker,body){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="overlay" data-dismiss="true"><section class="modal" role="dialog" aria-modal="true"><div class="modal-top"><div class="kicker">${kicker}</div><button class="modal-close" aria-label="Fechar">×</button></div><h2>${title}</h2>${body}</section></div>`;root.querySelector('.modal-close').onclick=()=>root.innerHTML='';root.querySelector('.overlay').onclick=e=>{if(e.target.dataset.dismiss)root.innerHTML=''};}
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function investigate(id){let clue=locations.flatMap(l=>l.clues).find(c=>c.id===id);if(!clue)return;if(!state.found.includes(id)){state.found.push(id);state.events.push(`Evidência coletada: ${clue.name}.`);save();render()}showModal(clue.name,'EVIDÊNCIA REGISTRADA',`<p>${clue.detail}</p><div class="modal-result">REGISTRADA NO DOSSIÊ &nbsp;·&nbsp; ${clue.source||locations.find(l=>l.clues.includes(clue))?.name||'ESTAÇÃO CENTRAL'}</div><div style="margin-top:19px"><button class="primary-btn modal-done">VOLTAR À INVESTIGAÇÃO</button></div>`);document.querySelector('.modal-done').onclick=()=>document.getElementById('modalRoot').innerHTML=''}
function interview(id){const s=suspects.find(x=>x.id===id);if(!s)return;if(state.interviewed.includes(id)){const answer=s.choices[0];showModal(s.name,s.role,`<div class="dialogue-box">${answer.result}</div><div class="modal-result">${answer.evidence.name} — registrada no dossiê.</div>`);return}showModal(s.name,s.role,`<p>${s.bio}</p><div class="dialogue-box">${s.question}</div><div class="choice-list">${s.choices.map((c,i)=>`<button class="choice-btn" data-answer="${id}:${i}">${c.text}</button>`).join('')}</div>`);document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{const choice=s.choices[Number(btn.dataset.answer.split(':')[1])];state.interviewed.push(id);state.events.push(`Depoimento registrado: ${s.name}.`);save();render();showModal('Uma peça se encaixa…','DEPOIMENTO REGISTRADO',`<div class="dialogue-box">${choice.result}</div><div class="modal-result">NOVA EVIDÊNCIA &nbsp;·&nbsp; ${choice.evidence.name}</div><div style="margin-top:19px"><button class="primary-btn modal-done">CONTINUAR</button></div>`);document.querySelector('.modal-done').onclick=()=>document.getElementById('modalRoot').innerHTML=''})}
function submitAccusation(){const who=document.getElementById('culprit')?.value,motive=document.getElementById('motive')?.value,proof=document.getElementById('proof')?.value;if(!who||!motive||!proof){toast('Preencha as três partes do relatório.');return}if(who==='elias'&&motive==='robbery'&&proof==='ledger'){state.complete=true;state.events.push('Caso solucionado: Elias Moura foi identificado como culpado.');save();render();showModal('Caso encerrado.','CONCLUSÃO CORRETA',`<p>O livro de despacho prova que Elias movimentou as caixas roubadas. Nuno confirmou o esquema, e Helena seria a próxima a denunciá-lo. Elias a matou para silenciá-la — mas não conseguiu apagar todas as pistas.</p><div class="modal-result">CULPADO: ELIAS MOURA &nbsp;·&nbsp; MOTIVO: ENCOBRIR O ROUBO<br>EVIDÊNCIA-CHAVE: LIVRO DE DESPACHO</div><div style="margin-top:19px"><button class="primary-btn modal-done">VER RELATÓRIO FINAL</button></div>`);document.querySelector('.modal-done').onclick=()=>{document.getElementById('modalRoot').innerHTML='';setView('board')};return}state.wrong++;save();const message=who!=='elias'?'Essa pessoa não tinha acesso às áreas restritas. Reavalie os horários e as pistas.':motive!=='robbery'?'O motivo não combina com as caixas sem registro e o telegrama de Helena.':'O livro de despacho conecta Elias diretamente às caixas roubadas. Procure-o na sala do chefe.';showModal('Há algo que não fecha.','CONCLUSÃO INCOMPLETA',`<p>${message}</p><div class="modal-result">Uma acusação precipitada pode deixar o culpado escapar. Reexamine as pistas antes de tentar novamente.</div><div style="margin-top:19px"><button class="secondary-btn modal-done">VOLTAR AO QUADRO</button></div>`);document.querySelector('.modal-done').onclick=()=>document.getElementById('modalRoot').innerHTML=''}
function resetCase(){if(confirm('Reiniciar a investigação? Todo o progresso deste caso será apagado.')){localStorage.removeItem('arquivo09');state={...initialState,found:[],interviewed:[],events:[],complete:false,wrong:0};render()}}
function bind(){document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>setView(el.dataset.view)));document.querySelectorAll('[data-location]').forEach(el=>el.addEventListener('click',()=>{state.location=el.dataset.location;setView('scene')}));document.querySelectorAll('[data-clue]').forEach(el=>el.addEventListener('click',()=>investigate(el.dataset.clue)));document.querySelectorAll('[data-interview]').forEach(el=>el.addEventListener('click',()=>interview(el.dataset.interview)));document.getElementById('submitAccusation')?.addEventListener('click',submitAccusation);document.getElementById('resetBtn')?.addEventListener('click',resetCase);document.getElementById('resetFromReport')?.addEventListener('click',resetCase);document.querySelector('.sound-btn')?.addEventListener('dblclick',()=>toast('Este arquivo não contém áudio.'));}
render();

</script>
</body>
</html>
